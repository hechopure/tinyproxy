# --- Puerto de escucha ---
Port 8888
Listen 0.0.0.0

# --- Usuario/grupo (baja privilegios tras arrancar) ---
User tinyproxy
Group tinyproxy

# --- PID ---
PidFile "/tmp/tinyproxy.pid"

# --- Logging ---
LogFile "/var/log/tinyproxy/tinyproxy.log"

# --- Timeout y límites ---
Timeout 600
MaxClients 100

# --- Puertos permitidos para CONNECT (HTTPS) ---
ConnectPort 443
ConnectPort 563

# --- Cabeceras ---
DisableViaHeader Yes
ViaProxyName "tinyproxy"

# --- Control de acceso (redes privadas + localhost para healthchecks) ---
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 192.168.200.0/24
Allow 127.0.0.0/8